services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ticket_arena_db
    ports:
      - "5432:5432"
    volumes:
      - ./.db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "ticket_arena_db", "-U", "kei" ]
      interval: 10s
      timeout: 10s
      retries: 3